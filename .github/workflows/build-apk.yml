# Compila o APK de teste (debug) a cada push e deixa pra download na aba "Actions" do GitHub.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O runner do GitHub já vem com o Android SDK instalado
      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SmartFiles-debug-apk
          path: app/build/outputs/apk/debug/*.apk
