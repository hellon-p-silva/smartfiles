# Compila o APK de teste (debug) a cada push e deixa pra download na aba "Actions" do GitHub.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # necessário pra publicar o APK em Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # O runner do GitHub já vem com o Android SDK instalado
      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SmartFiles-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Publica (ou atualiza) o release "latest-debug" com o APK, pra baixar direto no celular
      - name: Publicar APK em Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SmartFiles-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug SmartFiles-debug.apk \
            --prerelease \
            --title "SmartFiles (versão de teste)" \
            --notes "APK de teste gerado automaticamente do commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
